domain_standards:
  note: >-
    REWARD-ONLY and genuinely not applicable here. The midstream natural-gas
    market does have interchange standards — NAESB WGQ EDI/EDM for nominations
    and invoicing, FERC Order 587 electronic bulletin boards, and Quorum's
    TIPS/PGAS allocation formats — and DCP demonstrably operates systems in that
    family (Aligne scheduling, IPW informational postings for Centana, DCP
    Guadalupe, DCP Raptor, EasTrans and Jackson, TIPS/MyQuorum allocations).
    But NONE of those declare themselves in any contract we can read: the
    postings and the schedules sit behind the Aligne and MyQuorum logins. A
    domain-standard conformance recorded from prose on a marketing page would be
    a claim we invented, so nothing is asserted.
  candidates_not_verified:
    - {id: naesb-wgq-edi, reason: 'operated behind the Aligne login; no machine-readable declaration'}
    - {id: ferc-order-587-ebb, reason: 'IPW informational postings referenced but not reachable anonymously'}

  reason: no-developer-program
  detail: >-
    Phillips 66 runs real first-party software for DCP Midstream customers — FITS for
    wellhead and gathering data, TIPS/MyQuorum for allocations and revenue, Aligne for
    gas scheduling — but every one is an end-user web/mobile portal reached through an
    Azure AD B2C sign-in, and the Midstream customer-tools page that indexes them names
    no API, no data feed and no developer contact; the only machine-readable documents
    on the entire estate are the two OIDC discovery documents fronting those logins.
